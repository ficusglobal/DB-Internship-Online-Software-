# =====================================================================
# Internship Registration API
# Secrets come from environment variables. Locally they are read from the ".env" file in the
# project root (git-ignored); in production set real environment variables instead.
# ${NAME} = required, ${NAME:default} = optional with a default.
# =====================================================================
spring.config.import=optional:file:.env[.properties]

spring.application.name=internship-registration
server.port=${PORT:8080}

# ---------------------------------------------------------------------
# Database (TiDB Cloud / MySQL)
# Required: DB_URL, DB_USERNAME, DB_PASSWORD
# TiDB Cloud example:
#   jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/internship_db?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool. TiDB Cloud closes idle connections on its side, so connections are recycled
# before that happens (prevents "Communications link failure" after the app sits idle).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=60000

# JPA / Hibernate. "validate" = never changes the database; the app refuses to start if a
# table or column it needs is missing. Run SQL changes yourself (see database/ folder).
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Set SHOW_SQL=true in .env to print every SQL statement while debugging
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------
# JSON responses
# ---------------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null

# ---------------------------------------------------------------------
# JWT
# Required: JWT_SECRET (Base64, at least 32 bytes; create one with: openssl rand -base64 64)
# ---------------------------------------------------------------------
jwt.secret=${JWT_SECRET}
# Token lifetime in milliseconds (86400000 = 24 hours)
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ---------------------------------------------------------------------
# Razorpay
# Required: RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET
# Use rzp_test_... keys while testing.
# ---------------------------------------------------------------------
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

# ---------------------------------------------------------------------
# Email (Gmail / Google Workspace SMTP) for OTPs and payment emails
# MAIL_PASSWORD = a Google App Password (not the normal Gmail password).
# Without MAIL_PASSWORD the app still starts, but no email is sent.
# ---------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@ficusglobal.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Sender shown in the email (must be the Gmail account or an alias allowed on it)
app.mail.from=${MAIL_FROM:noreply@ficusglobal.com}
app.mail.from-name=${MAIL_FROM_NAME:Ficus Internship Portal}

# Optional: admin address told when paid students have no WhatsApp group yet
app.admin.notify-email=${ADMIN_NOTIFY_EMAIL:}

# ---------------------------------------------------------------------
# OTP rules (email verification before registration, password reset)
# ---------------------------------------------------------------------
app.otp.expiry-minutes=10
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
app.otp.max-per-hour=5
# Minutes the student has to submit the registration form after verifying the email
app.registration.email-token-minutes=30

# ---------------------------------------------------------------------
# Uploads (consent letters)
# Keep the folder OUTSIDE any public web folder; files are only served through the API.
# ---------------------------------------------------------------------
app.upload.dir=${APP_UPLOAD_DIR:./uploads}
app.upload.max-size-mb=${APP_UPLOAD_MAX_MB:1}