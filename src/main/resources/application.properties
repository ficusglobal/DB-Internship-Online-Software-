# Loads a local ".env" file if present (ignored in production, where real environment variables are used)
spring.config.import=optional:file:.env[.properties]

server.port=8080

# ---------------------------------------------------------------------
# Database (MySQL / MariaDB)
# Required env vars: DB_URL, DB_USERNAME, DB_PASSWORD
# Example DB_URL: jdbc:mysql://HOST:3306/DATABASE?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Fail fast (20s) instead of hanging if the remote database is unreachable
spring.datasource.hikari.connection-timeout=20000

# Explicit dialect. If your server is MariaDB use: org.hibernate.dialect.MariaDBDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------
# Response formatting & JWT
# Required env var: JWT_SECRET (Base64, e.g. from: openssl rand -base64 64)
# ---------------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ---------------------------------------------------------------------
# Razorpay
# Required env vars: RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET
# ---------------------------------------------------------------------
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

# ---------------------------------------------------------------------
# SMTP (Gmail / Google Workspace) for OTP emails
# Env vars: MAIL_USERNAME (optional), MAIL_PASSWORD (Google App Password)
# If MAIL_PASSWORD is not set the app still starts, but emails will fail to send.
# ---------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noreply@ficusglobal.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=noreply@ficusglobal.com
app.mail.from-name=Ficus Internship Portal

# ---------------------------------------------------------------------
# OTP rules
# ---------------------------------------------------------------------
app.otp.expiry-minutes=10
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
app.otp.max-per-hour=5